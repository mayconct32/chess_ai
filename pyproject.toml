[project]
name = "chess-aiv2"
version = "0.1.0"
description = ""
authors = [
    {name = "mayconct32",email = "maycon326754@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "langchain-google-genai (>=4.2.6,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "pypdf (>=6.14.2,<7.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "chess (>=1.11.2,<2.0.0)",
